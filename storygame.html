<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Second Chance: City of Secrets</title>
<style>
:root{--navy:#17233D;--navy2:#22325A;--blue:#3288E8;--cream:#FFF3DE;--coral:#FF6D76;--green:#4CBF91;--gold:#F5C451;--ink:#20283B;--muted:#5d6782;--fs:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
body{background:var(--navy);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;height:100vh;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:none;color:inherit;background:none}
button:disabled{cursor:not-allowed}
input{font:inherit}
.hidden{display:none!important}
#app{max-width:1180px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--cream)}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
/* ---------- MENU ---------- */
#menu{background:linear-gradient(180deg,#17233D 0%,#2B3F6E 70%,#3288E8 100%);color:#fff;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:auto}
#menu h1{font-size:clamp(1.8rem,6vw,3.2rem);letter-spacing:.04em;line-height:1.05}
#menu h1 span{display:block;color:var(--gold);font-size:.55em;letter-spacing:.3em;margin-top:6px}
.lineup{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:170px;margin:18px 0 10px}
.lineup svg{height:100%;width:auto;animation:idle 3s ease-in-out infinite}
.lineup svg:nth-child(2n){animation-delay:-1.4s}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:min(320px,90%);margin-top:8px}
.mbtn{background:var(--cream);color:var(--navy);font-weight:800;padding:13px;border-radius:14px;font-size:1.05rem;box-shadow:0 4px 0 #0004;transition:transform .1s}
.mbtn:hover{transform:translateY(-2px)}.mbtn.primary{background:var(--coral);color:#fff}
.mbtn:disabled{opacity:.45;transform:none}
.tagline{opacity:.85;max-width:520px;font-size:.92rem}
/* ---------- HUD ---------- */
#hud{background:var(--navy);padding:6px 8px 7px;display:flex;flex-direction:column;gap:5px;color:#fff;flex:0 0 auto}
.hrow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.card{background:var(--navy2);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;justify-content:center;line-height:1.15;min-width:78px}
.card small{font-size:.6rem;letter-spacing:.08em;opacity:.75;font-weight:700}
.card b{font-size:.95rem;white-space:nowrap}
.card.cash b{color:var(--gold)}.card.bank b{color:#8fd3ff}.card.debt b{color:var(--coral)}
.card.time{margin-left:auto}
.card .sub{font-size:.62rem;opacity:.8;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--navy2);border-radius:999px;padding:3px 9px;font-size:.72rem;font-weight:700;white-space:nowrap}
.bar{width:44px;height:6px;background:#0006;border-radius:3px;overflow:hidden;display:inline-block}.bar i{display:block;height:100%;background:var(--green);transition:width .4s}
.bar.low i{background:var(--coral)}
.iconbtn{background:var(--navy2);border-radius:10px;padding:0 12px;font-size:1.1rem;color:#fff}
.flash-up{animation:flashup .6s}
@keyframes flashup{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
/* ---------- MAIN ---------- */
#main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#scene{position:relative;flex:1 1 44%;min-height:160px;overflow:hidden;background:#9ED8FF}
#scene .bg{position:absolute;inset:0;width:100%;height:100%}
.cloud{animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(900px)}}
.actor{position:absolute;bottom:3%;height:80%;transform:translateX(-50%);transition:left .4s;pointer-events:none}
.actor svg{height:100%;width:auto;display:block;filter:drop-shadow(0 6px 3px #0003);animation:idle 3.2s ease-in-out infinite;transform-origin:bottom center}
.actor.enter{animation:enter .55s cubic-bezier(.2,1.4,.4,1)}
.actor.ex-angry svg{animation:shake .45s 2,idle 3.2s ease-in-out .9s infinite}
.actor.ex-happy svg{animation:hop .5s 1,idle 3.2s ease-in-out .5s infinite}
.actor.ex-sad svg{filter:drop-shadow(0 6px 3px #0003) saturate(.75)}
.mouth-talk{animation:talk .22s infinite alternate;transform-origin:60px 81px}
.nametag{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:8px;white-space:nowrap}
@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(1.01)}}
@keyframes enter{from{opacity:0;transform:translateX(-50%) translateY(40px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-2deg)}75%{transform:translateX(6px) rotate(2deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.1)}}
.loc-badge{position:absolute;top:8px;left:8px;background:#17233Dcc;color:#fff;padding:5px 11px;border-radius:10px;font-weight:800;font-size:.82rem;z-index:2}
.loc-badge span{font-weight:600;opacity:.8;margin-left:6px}
.scene-fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.burst{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:900;color:var(--gold);text-shadow:0 3px 0 #17233D;animation:burst 1.1s forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
/* ---------- DIALOGUE ---------- */
#dlg{flex:0 1 auto;max-height:58%;overflow:auto;background:var(--cream);border-top:4px solid var(--navy);padding:12px 14px 14px}
.dlg-in{animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dhead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.portrait{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--navy);overflow:hidden;flex:0 0 auto}
.portrait svg{width:100%;height:100%}
.evtag{font-size:.68rem;font-weight:800;letter-spacing:.1em;color:var(--coral)}
.speaker{font-weight:900;font-size:1.08rem;color:var(--navy)}
.speaker small{font-weight:600;color:var(--muted);font-size:.75rem;margin-left:6px}
.desc{color:var(--muted);font-size:.92rem;margin:4px 0 6px;font-style:italic}
.say{font-size:1.06rem;line-height:1.45;margin-bottom:10px;background:#fff;border-radius:12px;padding:10px 12px;border:2px solid #17233D22}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px;border-radius:14px;font-weight:700;font-size:.98rem;color:#fff;box-shadow:0 4px 0 #0003;transition:transform .1s,filter .1s;min-height:64px}
.choice:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.07)}
.choice:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0003}
.choice.a{background:var(--blue)}.choice.b{background:var(--coral)}
.choice .k{background:#fff;color:var(--navy);border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:900;flex:0 0 auto}
.choice small{display:block;font-weight:600;opacity:.92;font-size:.76rem;margin-top:3px}
.choice:disabled{background:#9aa1b3;box-shadow:none}
.result{background:#fff;border-left:6px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:1.02rem;line-height:1.45;animation:pop .35s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.echip{font-size:.75rem;font-weight:800;padding:3px 9px;border-radius:999px;background:#e8ecf5}
.echip.pos{background:#d9f3e8;color:#1d7a55}.echip.neg{background:#ffe1e3;color:#b3303a}.echip.gold{background:#fff0c7;color:#8a6200}.echip.info{background:#dde9fb;color:#1f5fae}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--navy);color:#fff;font-weight:800;padding:10px 16px;border-radius:12px;box-shadow:0 3px 0 #0004}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
.btn.green{background:var(--green)}.btn.coral{background:var(--coral)}.btn.blue{background:var(--blue)}.btn.gold{background:var(--gold);color:var(--navy)}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:9px}
.btn:disabled{background:#b8bdc9;color:#fff;box-shadow:none;border-color:transparent}
.lochead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lochead b{font-size:1.1rem;color:var(--navy)}
.objective{background:var(--navy);color:#fff;border-radius:10px;padding:7px 10px;font-size:.85rem;margin:8px 0;display:flex;gap:8px;align-items:center}
.objective b{color:var(--gold)}
.flashmsg{background:#fff;border-left:5px solid var(--blue);padding:7px 10px;border-radius:8px;font-size:.9rem;margin:6px 0}
.people{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.pchip{display:flex;align-items:center;gap:7px;background:#fff;border:2px solid var(--navy);border-radius:999px;padding:3px 12px 3px 3px;font-weight:800;font-size:.86rem}
.pchip .portrait{width:34px;height:34px;border-width:2px}
.pchip:hover{background:#fff7e6}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:6px}
.abtn{background:#fff;border:2px solid #17233D33;border-radius:12px;padding:8px 10px;text-align:left;transition:border-color .15s,transform .1s}
.abtn:hover:not(:disabled){border-color:var(--blue);transform:translateY(-1px)}
.abtn b{display:block;font-size:.9rem}
.abtn small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px}
.abtn .why{color:#c0392b;font-weight:700}
.abtn:disabled{opacity:.62;background:#f3efe7}
.abtn.job{border-color:var(--gold)}
/* ---------- SHEET ---------- */
#sheet{position:absolute;inset:0;background:var(--cream);z-index:20;overflow:auto;animation:slideup .25s}
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.shead{position:sticky;top:0;background:var(--navy);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.shead h2{font-size:1.1rem;letter-spacing:.04em}
.sbody{padding:12px 14px 20px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:999px;background:#fff;border:2px solid var(--navy);font-weight:800;font-size:.82rem}
.tab.on{background:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.box{background:#fff;border-radius:14px;padding:12px;border:2px solid #17233D1f}
.box h3{font-size:1rem;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.box p{font-size:.86rem;color:#3a4460;margin:3px 0}
.box .meta{font-size:.76rem;color:var(--muted)}
.box.locked{opacity:.6;background:#efe9de}
.box.here{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.box.done{border-color:var(--green)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tag{font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px;background:#e8ecf5;color:var(--navy)}
.tag.ok{background:#d9f3e8;color:#1d7a55}.tag.no{background:#ffe1e3;color:#b3303a}.tag.gold{background:#fff0c7;color:#8a6200}
.locicon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.5rem;flex:0 0 auto}
.obj{font-size:.85rem;margin:2px 0}.obj.ok{color:#1d7a55}.obj.ok::before{content:"✔ "}.obj.no::before{content:"○ "}
.stage{display:flex;gap:3px;margin:6px 0}.stage i{flex:1;height:7px;border-radius:4px;background:#e2e5ee}.stage i.on{background:var(--coral)}
.charcard{display:flex;gap:10px}
.charcard .pic{width:84px;flex:0 0 auto;background:#f7efe0;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;height:130px}
.charcard .pic svg{height:125px;width:auto}
.mood{font-size:.8rem;font-weight:700}
.msg{background:#fff;border-radius:12px;padding:9px 12px;margin-bottom:8px;border-left:5px solid var(--blue)}
.msg.unread{border-left-color:var(--coral)}
.msg b{color:var(--navy)}.msg small{color:var(--muted);float:right}
.amount{width:130px;padding:8px;border-radius:10px;border:2px solid var(--navy);margin-right:6px}
.kv{display:flex;justify-content:space-between;font-size:.9rem;padding:3px 0;border-bottom:1px dashed #0001}
.kv b{color:var(--navy)}
.pos-t{color:#1d7a55;font-weight:800}.neg-t{color:#b3303a;font-weight:800}
/* ---------- NAV ---------- */
#nav{display:grid;grid-template-columns:repeat(7,1fr);background:var(--navy);padding:5px 4px calc(5px + env(safe-area-inset-bottom));gap:3px;flex:0 0 auto}
.nb{display:flex;flex-direction:column;align-items:center;gap:1px;color:#c9d3ea;padding:6px 2px;border-radius:12px;font-size:.66rem;font-weight:800;letter-spacing:.05em;position:relative}
.nb span{font-size:1.25rem;line-height:1}
.nb:hover{background:#ffffff14}
.nb.on{background:var(--gold);color:var(--navy)}
.badge{position:absolute;top:2px;right:18%;background:var(--coral);color:#fff;border-radius:999px;font-size:.6rem;padding:0 5px;min-width:16px}
/* ---------- TOASTS & MODAL ---------- */
#toasts{position:fixed;top:92px;right:10px;z-index:100;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(330px,80vw)}
.toast{background:#fff;color:var(--ink);border-radius:10px;padding:7px 11px;font-size:.8rem;font-weight:800;box-shadow:0 6px 18px #0003;border-left:6px solid var(--blue);animation:tin .3s, tout .4s 2.8s forwards}
.toast.pos{border-color:var(--green)}.toast.neg{border-color:var(--coral)}.toast.gold{border-color:var(--gold);background:#fffaf0}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
#modal{position:fixed;inset:0;background:#0b1430b3;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.mcard{background:var(--cream);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:18px;border:4px solid var(--navy);animation:pop .25s}
.mcard h2{color:var(--navy);margin-bottom:8px}
.mcard p,.mcard li{font-size:.92rem;line-height:1.45;margin-bottom:6px}
.mcard ul{padding-left:18px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* ---------- ENDING ---------- */
#ending{overflow:auto;background:linear-gradient(#17233D,#2B3F6E);color:#fff;padding:20px}
.endcard{max-width:820px;margin:0 auto}
.endcard h1{font-size:clamp(1.6rem,5vw,2.6rem);color:var(--gold)}
.endcard .box{color:var(--ink);margin-top:12px}
@media (max-width:640px){
 .choices{grid-template-columns:1fr}
 .card{min-width:0;padding:3px 8px}.card b{font-size:.82rem}
 .card.time{margin-left:0}
 .chip{font-size:.66rem;padding:2px 7px}.bar{width:30px}
 #dlg{max-height:62%}
 .nb{font-size:.56rem}.nb span{font-size:1.1rem}
 .acts{grid-template-columns:1fr 1fr}
 #toasts{top:auto;bottom:80px}
}
</style>
</head>
<body>
<div id="app">
 <section id="menu" class="screen">
  <h1>SECOND CHANCE<span>CITY OF SECRETS</span></h1>
  <div class="lineup" id="lineup"></div>
  <p class="tagline">Your father left you a bicycle, a box of receipts — and a ₹50,000 debt to a man named Kade. Work, love, investigate, and decide what kind of future you'll build.</p>
  <div class="menu-btns">
   <button class="mbtn primary" data-act="newGame">▶ New Game</button>
   <button class="mbtn" data-act="continue" id="contBtn">⟳ Continue</button>
   <button class="mbtn" data-act="settings">⚙ Settings</button>
   <button class="mbtn" data-act="howto">❓ How to Play</button>
  </div>
 </section>
 <section id="game" class="screen hidden">
  <header id="hud"></header>
  <main id="main">
   <div id="scene"></div>
   <div id="dlg"></div>
   <div id="sheet" class="hidden"></div>
  </main>
  <nav id="nav">
   <button class="nb" data-act="tab" data-arg="home"><span>🏠</span>HOME</button>
   <button class="nb" data-act="tab" data-arg="city"><span>🗺️</span>CITY</button>
   <button class="nb" data-act="tab" data-arg="phone"><span>📱</span>PHONE</button>
   <button class="nb" data-act="tab" data-arg="jobs"><span>💼</span>JOBS</button>
   <button class="nb" data-act="tab" data-arg="quests"><span>📜</span>QUESTS</button>
   <button class="nb" data-act="tab" data-arg="rel"><span>💞</span>PEOPLE</button>
   <button class="nb" data-act="tab" data-arg="inv"><span>🎒</span>ITEMS</button>
  </nav>
 </section>
 <section id="ending" class="screen hidden"></section>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" class="hidden"></div>

<script>
'use strict';
/* =====================================================================
   SECOND CHANCE: CITY OF SECRETS — single-file life sim
   Modules: Util, Sound, Data (PEOPLE/ITEMS/LOCS/JOBS/BIZ/QUESTS/EVENTS),
   Player, RelationshipManager, DecisionEngine, EventManager, EconomyManager,
   CareerManager, BusinessManager, QuestManager, TimeManager, LocationManager,
   InventoryManager, SaveManager, UIManager, Game
   ===================================================================== */

/* ---------------- Util ---------------- */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
const per=h=>h<12?0:h<17?1:h<21?2:3;
const PERIODS=['Morning','Afternoon','Evening','Night'];
const PICON=['🌅','☀️','🌇','🌙'];
const hm=h=>String(Math.min(24,h)).padStart(2,'0')+':00';
const SAVE_KEY='secondchance_cos_save_v1',SET_KEY='secondchance_cos_settings';
let S=null;
const Settings={sound:true,text:'m',info:false};
const P=()=>per(S.hour);
const F=k=>S.flags[k];
const has=i=>(S.inv[i]||0)>0;
const Q=id=>!!S.quests[id];
const hired=j=>!!(S.jobs[j]&&S.jobs[j].hired);
const EVIDENCE=['ev_notice','ev_receipt','ev_letter','ev_photo','ev_manifest'];
const evCount=()=>EVIDENCE.filter(has).length;
const ROMANCE=['aanya','riya','meera','sana'];
const STAGES=['Stranger','Acquaintance','Friend','Romantic Interest','Dating','Committed'];
const today=k=>S.today.misc[k]||0;
const bump=k=>{S.today.misc[k]=(S.today.misc[k]||0)+1};

/* ---------------- Sound (Web Audio, generated) ---------------- */
const Sound={ctx:null,
 tone(f,d,type='sine',v=.06,delay=0,slide=0){ if(!Settings.sound)return; try{
  this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();
  const c=this.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);}catch(e){} },
 click(){this.tone(620,.05,'triangle',.04)},
 money(){this.tone(988,.08,'square',.03);this.tone(1318,.14,'square',.03,.07)},
 quest(){[523,659,784,1046].forEach((f,i)=>this.tone(f,.16,'triangle',.05,i*.09))},
 bad(){this.tone(300,.25,'sawtooth',.035,0,-140)},
 travel(){this.tone(400,.18,'sine',.05,0,300)},
 ach(){[784,988,1175,1568].forEach((f,i)=>this.tone(f,.2,'square',.025,i*.07))},
 note(){this.tone(880,.08,'sine',.05);this.tone(660,.1,'sine',.04,.08)}
};

/* ---------------- Characters ---------------- */
const PEOPLE={
 player:{name:'You',role:'Protagonist, 21',look:{skin:'#B97A56',hair:'#1E1A2E',style:'spiky',top:'#3288E8',outfit:'hoodie',pants:'#2E3B55'}},
 aanya:{name:'Aanya',role:'Bookstore assistant, 23',look:{skin:'#C68A62',hair:'#2B1A14',style:'braid',top:'#E2A93B',outfit:'cardigan',pants:'#5A4A7A',acc:'glasses'}},

const STATN={cash:'CASH',bank:'BANK',debt:'DEBT',energy:'ENERGY',happy:'HAPPINESS',int:'INTELLIGENCE',cha:'CHARISMA',str:'STRENGTH',pop:'POPULARITY',hon:'HONESTY',dep:'RELIABILITY'};
const Player={
 repLabel(){const a=[];if(S.dep>=5)a.push('Dependable');else if(S.dep<=-5)a.push('Unreliable');if(S.hon>=5)a.push('Honest');else if(S.hon<=-5)a.push('Dishonest');if(S.dep>=8&&S.hon>=3)a.splice(0,1,'Responsible');return a.length?a.join(' · '):'Unknown';},
 apply(e,tag){
  if(!e)return [];
  const chips=[];
  if(e.fn)e.fn(S);
  for(const k of ['cash','bank','debt','energy','happy','int','cha','str','pop','hon','dep']){
   if(!e[k])continue;let d=e[k];
   if(k==='cash'||k==='bank'){if(S[k]+d<0)d=-S[k];S[k]+=d;if(k==='cash'&&d>0)S.earned+=d;}
   else if(k==='debt'){const nd=Math.max(0,S.debt+d);d=nd-S.debt;S.debt=nd;}
   else{const lim=(k==='hon'||k==='dep')?[-20,20]:[0,100];const nv=clamp(S[k]+d,lim[0],lim[1]);d=nv-S[k];S[k]=nv;}
   if(!d)continue;
   const money=k==='cash'||k==='bank'||k==='debt',good=k==='debt'?d<0:d>0;
   chips.push({t:money?`${d>0?'+':'−'}${fmt(d)} ${STATN[k]}`:`${d>0?'+':''}${d} ${STATN[k]}`,c:good?'pos':'neg'});
   if(k==='cash'&&d>0)Sound.money();
   UI.pulse(k);
  }
  if(e.hours)Time.adv(e.hours);
  if(e.items)for(const [i,n] of Object.entries(e.items)){S.inv[i]=Math.max(0,(S.inv[i]||0)+n);if(!S.inv[i])delete S.inv[i];chips.push({t:`${n>0?'ITEM +':'ITEM −'} ${ITEMS[i].i} ${ITEMS[i].n}`,c:n>0?'gold':'neg'});}
  if(e.flags)Object.assign(S.flags,e.flags);
  if(e.unflag)e.unflag.forEach(f=>delete S.flags[f]);
  if(e.rel)for(const [c,o] of Object.entries(e.rel))chips.push(...Rel.mod(c,o));
  if(e.stage)for(const [c,n] of Object.entries(e.stage))chips.push(...Rel.setStage(c,n));
  if(e.unlock)e.unlock.forEach(l=>Loc.unlock(l,chips));
  if(e.hire){Career.hire(e.hire);chips.push({t:`HIRED — ${JOBS[e.hire].n.toUpperCase()}`,c:'gold'});}
  if(e.xp)for(const [j,n] of Object.entries(e.xp)){Career.ensure(j);S.jobs[j].xp+=n;}
  if(e.msg)Phone.push(e.msg.from,e.msg.text);
  chips.forEach(c=>UI.toast(c.t+(tag?' — '+tag:''),c.c));
  return chips;
 }
};

/* ---------------- RelationshipManager ---------------- */
const Rel={
 here(c){const w=CHARD[c].where[S.loc];return !!w&&w.includes(P())&&S.chars[c].fru<60&&S.hour<22;},
 present(){return ROMANCE.filter(c=>S.chars[c].stage>0&&Rel.here(c));},
 mod(c,o){
  const R=S.chars[c],n=PEOPLE[c].name,out=[];
  for(const k of ['aff','trust','int','fru']){
   if(!o[k])continue;let d=o[k];
   if(k==='trust'&&d>0&&R.fru>=40)d=Math.ceil(d/2);
   const nv=clamp(R[k]+d,0,100);d=nv-R[k];R[k]=nv;if(!d)continue;
   const lbl={aff:['♥ AFFECTION','♥ AFFECTION'],trust:['🤝 TRUST','🤝 TRUST'],int:['✨ INTEREST','✨ INTEREST'],fru:['😠 FRUSTRATION','😌 FRUSTRATION']}[k];
   const good=k==='fru'?d<0:d>0;
   out.push({t:`${n.toUpperCase()}: ${lbl[0]} ${Settings.info?(d>0?'+':'')+d:(d>0?'UP':'DOWN')}`,c:good?'pos':'neg'});
  }
  return out;
 },
 setStage(c,n){
  const R=S.chars[c];if(R.stage===n)return [];
  if(n>=1&&!R.metDay)R.metDay=S.day;
  R.stage=n;Sound.note();
  return [{t:`RELATIONSHIP UPDATE — ${PEOPLE[c].name.toUpperCase()}: ${STAGES[n].toUpperCase()}`,c:'gold'}];
 },
 otherDating(c){return ROMANCE.find(x=>x!==c&&S.chars[x].stage>=4);},
 mood(c){const R=S.chars[c];if(R.fru>=60)return ['Needs space right now','neg-t'];if(R.fru>=35)return ['A little frustrated with you','neg-t'];if(R.aff>=70)return ['Lights up when you\'re around','pos-t'];if(R.aff>=40)return ['Enjoys your company','pos-t'];if(R.aff>=15)return ['Friendly','pos-t'];return R.stage?['Polite, still getting to know you','']:['You haven\'t met yet',''];},
 dateBlock(c){const R=S.chars[c];
  if(P()!==2)return 'She prefers evening plans — ask in the evening.';
  if(R.fru>=35)return '"I think I need a little space this week."';
  if(S.day-R.lastDate<2)return '"We just went out! Let\'s not rush things."';
  if(S.energy<25)return '"You look exhausted. Rest first, okay?"';
  return '';},
 gift(c,item){
  const R=S.chars[c],n=PEOPLE[c].name,L=LIKES[c];
  if(!has(item)||S.today.gift[c])return;
  S.today.gift[c]=1;S.inv[item]--;if(!S.inv[item])delete S.inv[item];
  const recent=R.gifts.filter(g=>S.day-g.d<=3).length;R.gifts.push({i:item,d:S.day});
  let eff,line,ex;
  if(L.hate.includes(item)){eff={aff:-3,fru:8};ex='confused';line=item==='perfume'?'"This is… a lot. You don\'t need to buy me expensive things."':'"Oh. Thanks… it\'s not really my thing."';}
  else if(L.love.includes(item)){eff={aff:recent>=2?3:7,int:3,trust:R.stage>=2?1:0};ex='happy';line='"You remembered what I love. That\'s really thoughtful."';}
  else{eff={aff:recent>=2?1:2};ex='neutral';line='"That\'s sweet of you, thanks."';}
  if(recent>=2){eff.fru=(eff.fru||0)+5;line+=' "…You don\'t have to keep giving me things, you know."';}
  const chips=Player.apply({rel:{[c]:eff}});
  UI.sayEvent(c,`A gift for ${n}`,`You give ${n} the ${ITEMS[item].n}. ${line}`,ex,chips);
 }
};

E('bike_letter',{title:'Under the bicycle seat',sp:'player',chars:[['player','sad']],desc:'While oiling the chain, you notice the seat is loose. Inside the frame: a sealed envelope with your name on it.',

E('kade_missed',{rep:1,title:'Kade comes to collect',sp:'kade',chars:[['kade','angry']],desc:'The black sedan is back. Kade doesn\'t bother taking off his glasses.',

E('farah_intro',{trig:'arrive',loc:'*',per:[0,1,2],cond:()=>evCount()>=2&&!F('met_farah')&&S.day>=3,title:'A stranger with a badge',sp:'farah',chars:[['farah','neutral']],desc:'A woman in a trench coat falls into step beside you.',

E('depot_clue',{rep:1,title:'Inside SwiftLine',sp:'player',chars:[['player','confused'],['hari','neutral']],desc:'During a quiet moment, you spot two clipboards on the dispatch desk. Dad died on May 9.',

E('iyer_intro',{trig:'arrive',loc:'business',per:[0,1,2],cond:()=>!F('met_iyer'),title:'A mentor on a bench',sp:'iyer',chars:[['iyer','happy']],desc:'An older man feeding pigeons outside a glass tower waves you over.',
 text:'"Everybody wants a business. Few want the boring parts — costs, suppliers, showing up. Which kind are you?"',ch:[
 {t:'Ask him how to read a profit sheet',sub:'+2 INT',eff:{int:2,flags:{met_iyer:1}},res:'"Revenue minus costs. Everything else is decoration." You can now start a business from JOBS → Business.',expr:'happy'},
 {t:'Pitch him your idea with confidence',sub:'+2 CHA, +2 POP',eff:{cha:2,pop:2,flags:{met_iyer:1}},res:'"Bold. Now back it with numbers." You can now start a business from JOBS → Business.',expr:'happy'}]});
E('crossroads',{trig:'arrive',loc:'home',cond:()=>Q('q3')&&Q('q4')&&Q('q6')&&S.day>=12&&!F('truth_path')&&!F('deal_path'),title:'The Next Chapter',sp:'kade',chars:[['kade','neutral'],['mom','sad']],desc:'Kade is waiting on your porch. For once, he sounds almost friendly.',

 {t:'Take the deal and hand over the papers',sub:'−₹20,000 debt, lose evidence',eff:{debt:-20000,hon:-3,fn:s=>{EVIDENCE.forEach(i=>delete s.inv[i]);s.flags.deal_path=1;s.flags.deal_day=s.day},msg:{from:'Mr. Kade',text:'Pleasure doing business. I will collect the rest in two days. Have it ready.'}},res:'Kade pockets every document. The debt drops by ₹20,000… and Dad\'s story disappears into his briefcase. FINALE: Kade returns home in 2 days.',expr:'happy',rec:'Took Kade\'s ₹20,000 deal'}]});
const exposeRun=(pub)=>()=>{const n=evCount(),full=n>=4,before=S.debt;S.debt=full?0:Math.round(S.debt/2);
 return {eff:{pop:pub?15:3,cha:pub?2:0,int:pub?0:2,happy:10,flags:{exposed:1,exposed_full:full?1:0,public_testimony:pub?1:0}},res:(full?`With ${n} pieces of evidence, the fraud is undeniable. KD Finance is shut down and the forged loan is void — your remaining ${fmt(before)} debt is erased.`:`With only ${n} pieces of evidence, the court voids part of the loan. Your debt is halved to ${fmt(S.debt)}.`)+(pub?' Your testimony makes the evening news.':' Your statement stays sealed; the city never learns your name.'),expr:'happy',end:true,rec:pub?'Testified publicly against KD Finance':'Gave a sealed statement against KD Finance'};};
E('finale_truth',{title:'FINALE — The hearing',sp:'farah',chars:[['farah','neutral'],['kade','angry']],desc:'A small hearing room on the 14th floor. Kade arrives with a lawyer and a very expensive frown.',
 text:()=>`"You have ${evCount()} pieces of evidence. Four or more and we can void the whole loan. How do you want to do this?"`,ch:[
 {t:'Testify publicly',sub:'+15 POP',run:exposeRun(1)},
 {t:'Give a sealed, private statement',sub:'Safer, quieter',run:exposeRun(0)}]});
E('finale_deal',{rep:1,trig:'arrive',loc:'home',cond:()=>F('deal_path')&&S.day>=(F('deal_day')||0)+2&&!S.ending,title:'FINALE — Kade returns',sp:'kade',chars:[['kade','neutral'],['mom','sad']],desc:'The sedan idles at the gate. Mom watches from the window.',
 text:()=>`"Remaining balance: ${fmt(S.debt)}. Pay it all and you never see me again."`,ch:[
 {t:'Pay the full amount now',sub:'Uses cash, then savings',req:{fn:()=>S.cash+S.bank>=S.debt?'':`Need ${fmt(S.debt)} in cash + bank`},run:()=>{const d=S.debt;const fromCash=Math.min(S.cash,d);S.cash-=fromCash;S.bank-=d-fromCash;S.paidTotal+=d;S.debt=0;return {eff:{happy:12,flags:{paid_kade:1}},res:`You hand over ${fmt(d)}. Kade counts it twice, nods, and drives away for good.`,expr:'neutral',end:true,rec:'Paid Kade in full'};}},
 {t:()=>F('extended')?'Admit you can\'t pay — face the consequences':'Ask for one last extension (+₹2,000, 5 days)',run:()=>F('extended')?{eff:{happy:-10},res:'Kade sighs. "Then we do this the long way." The debt will follow you for years.',expr:'angry',end:true,rec:'Couldn\'t pay Kade in the end'}:{eff:{debt:2000,flags:{extended:1,deal_day:S.day+3}},res:'"Five days. Not one more." Kade adds ₹2,000 for his patience.',expr:'angry',rec:'Begged Kade for an extension'}}]});
E('final_reckoning',{trig:'day',cond:()=>S.day>=40&&!S.ending,title:'FINALE — The final deadline',sp:'kade',chars:[['kade','angry']],desc:'Day 40. Kade\'s patience has run out.',
 text:()=>`"Time\'s up. Remaining balance: ${fmt(S.debt)}. What\'s it going to be?"`,ch:[
 {t:'Pay everything you have',run:()=>{const amt=Math.min(S.debt,S.cash+S.bank);const fc=Math.min(S.cash,amt);S.cash-=fc;S.bank-=amt-fc;S.debt-=amt;S.paidTotal+=amt;return {eff:{},res:`You hand over ${fmt(amt)}. ${S.debt?`${fmt(S.debt)} remains.`:'The debt is finally gone.'}`,expr:'neutral',end:true,rec:'Paid everything at the final deadline'};}},
 {t:'Call Farah for help',req:{flag:'met_farah'},sub:'Requires meeting Farah',run:()=>{if(evCount()>=3){S.debt=Math.round(S.debt/2);return {eff:{flags:{exposed:1}},res:`Farah arrives with a warrant. Your evidence halves the debt to ${fmt(S.debt)}.`,expr:'happy',end:true,rec:'Called Farah at the last minute'};}return {eff:{},res:'Farah tries, but without enough evidence she can only slow Kade down.',expr:'sad',end:true,rec:'Called Farah without enough evidence'};}}]});

/* ---------------- DecisionEngine & EventManager ---------------- */
const Ev={
 get(st){if(!st)return null;try{if(st.gen)return GEN[st.gen]?GEN[st.gen](st.p||{}):null;}catch(e){return null;}return EVENTS[st.id]||null;},
 start(x){
  if(typeof x==='string'&&x.startsWith('@')){const [g,a]=x.slice(1).split('|');S.ev={gen:g,p:{j:a}};}
  else if(typeof x==='string')S.ev={id:x};
  else S.ev=x;
  if(!Ev.get(S.ev))S.ev=null;
  UI.sceneKey='';
 },
 next(){while(S.queue.length){const id=S.queue.shift();const e=EVENTS[id];if(e&&(e.rep||!S.done[id])){Ev.start(id);return true;}}return false;},
 scan(){
  if(S.ev||S.ending)return false;
  for(const id in EVENTS){const e=EVENTS[id];if(e.trig!=='arrive')continue;
   if(e.loc!=='*'&&e.loc!==S.loc)continue;if(e.per&&!e.per.includes(P()))continue;if(S.hour>=23)continue;
   if(!e.rep&&S.done[id])continue;
   try{if(e.cond&&!e.cond())continue;}catch(err){continue;}
   Ev.start(id);return true;}
  return false;},
 dayScan(){for(const id in EVENTS){const e=EVENTS[id];if(e.trig!=='day'||(!e.rep&&S.done[id])||S.queue.includes(id))continue;try{if(e.cond&&e.cond())S.queue.push(id);}catch(err){}}}
};
const Dec={
 blocked(ch){const r=ch.req;if(!r)return '';
  for(const k of ['int','cha','str','pop','energy'])if(r[k]!=null&&S[k]<r[k])return `Requires ${k==='energy'?'ENERGY':STATN[k]} ${r[k]}`;
  if(r.cash!=null&&S.cash<r.cash)return `Requires ${fmt(r.cash)} cash`;
  if(r.hours&&S.hour+r.hours>24)return 'Not enough time left today';
  if(r.item&&!has(r.item))return `Requires: ${ITEMS[r.item].n}`;
  if(r.flag&&!F(r.flag))return 'Not available yet';
  if(r.fn)return r.fn()||'';
  return '';},
 lock:false,
 choose(i){
  const st=S.ev;if(!st||st.res||Dec.lock)return;
  const ev=Ev.get(st);const ch=ev&&ev.ch[i];if(!ch)return;
  const why=Dec.blocked(ch);if(why){UI.toast(why,'info');Sound.bad();return;}
  Dec.lock=true;
  let out={eff:ch.eff,res:ch.res||'',next:ch.next||null,expr:ch.expr||'neutral',end:false,rec:ch.rec};
  if(ch.run)Object.assign(out,ch.run()||{});
  st.res={text:out.res,chips:[],next:out.next,expr:out.expr,end:!!out.end,pick:i};
  if(st.id&&!ev.rep)S.done[st.id]=1;
  if(out.rec)S.decisions.push(`Day ${S.day}: ${out.rec}`);
  const chips=Player.apply(out.eff);
  st.res.chips=chips;
  if(chips.some(c=>c.c==='neg')&&!chips.some(c=>c.c==='pos'||c.c==='gold'))Sound.bad();else Sound.click();
  if(chips.some(c=>c.t.startsWith('+₹')))UI.burst(chips.find(c=>c.t.startsWith('+₹')).t.split(' ')[0]);
  Game.after(true);
  setTimeout(()=>{Dec.lock=false},250);
 },

   S.dueDay+=7;S.paidWeek=0;}
  if(S.debt>0)L.push(['📅 Next installment',`${fmt(Math.min(S.dueAmt,S.debt))} by end of Day ${S.dueDay}`]);

/* ---------------- SaveManager ---------------- */
const Save={
 save(silent){if(!S)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));if(!silent)UI.toast('💾 GAME SAVED','info');}catch(e){if(!silent)UI.toast('Could not save (storage blocked)','neg');}},
 exists(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}},
 load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;return Save.validate(JSON.parse(raw));}catch(e){return null;}},
 validate(o){if(!o||typeof o!=='object')return null;const d=defaultState(typeof o.name==='string'?o.name:'Arjun');
  for(const k in d){if(d[k]===null){if(o[k]===undefined)o[k]=null;continue;}
   if(o[k]===undefined||o[k]===null||typeof o[k]!==typeof d[k]||Array.isArray(d[k])!==Array.isArray(o[k]))o[k]=d[k];
   else if(typeof d[k]==='number'&&!isFinite(o[k]))o[k]=d[k];}
  for(const c of ROMANCE)o.chars[c]=Object.assign({},d.chars[c],o.chars[c]&&typeof o.chars[c]==='object'?o.chars[c]:{});
  for(const k of ['talk','gift','hang','jobs','misc'])if(!o.today[k]||typeof o.today[k]!=='object')o.today[k]={};
  ['cash','bank','debt'].forEach(k=>o[k]=Math.max(0,Math.round(o[k])));
  o.hour=clamp(o.hour,0,24);o.day=Math.max(1,Math.floor(o.day));
  for(const i in o.inv)if(!ITEMS[i]||!(o.inv[i]>0))delete o.inv[i];
  o.unlocked=o.unlocked.filter(l=>LOCS[l]);if(!o.unlocked.includes('home'))o.unlocked.push('home');if(!LOCS[o.loc])o.loc='home';
  o.queue=o.queue.filter(x=>typeof x==='string'&&(EVENTS[x]||x.startsWith('@')));
  if(o.biz&&(typeof o.biz!=='object'||!BIZ[o.biz.type]))o.biz=null;
  S=o;if(o.ev&&!Ev.get(o.ev))o.ev=null;S=null;
  return o;},
 reset(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
};

const Game={
 newGame(name){S=defaultState(name);UI.tab=null;UI.flash='';UI.sceneKey='';$('#sheet').classList.add('hidden');Ev.next();UI.show('game');Save.save(true);UI.render();},
 continue(){const s=Save.load();if(!s){UI.toast('No valid save found','neg');return;}S=s;UI.tab=null;UI.sceneKey='';UI.flash='';
  if(S.ending){Game.showEnding();return;}UI.show('game');$('#sheet').classList.add('hidden');Game.after();UI.toast('Welcome back!','info');},
 after(skipScan){
  Quest.check();Loc.check();Ach.check();
  if(!S.ev&&!skipScan){if(!Ev.next())Ev.scan();}
  if(!S.ev&&S.hour>=24&&!S.ending){UI.toast('Midnight — you head home and collapse into bed','info');S.loc='home';Time.sleep();return;}
  Save.save(true);UI.render();},
 finish(){
  const n=evCount(),stable=!!S.biz||Object.keys(S.jobs).some(j=>hired(j)&&(j==='analyst'||j==='courier'||(j!=='delivery'&&Career.level(j)>=3)));
  let k;if(F('exposed'))k='B';else if(S.debt===0&&stable)k='A';else if(S.debt<=15000&&S.happy>=40&&S.int+S.cha+S.str>=55)k='C';else k='D';
  const bonus=k==='B'&&S.debt===0&&stable?' — and Financial Independence':'';
  S.ending={k,day:S.day,bonus};S.ev=null;Save.save(true);Sound.ach();Game.showEnding();},
 showEnding(){const k=S.ending.k;
  const T={A:['Ending A — Financial Independence','You paid every rupee yourself. KD Finance is a bad memory, and your work finally pays more than your bills. Mom has started planting tomatoes again.'],
   B:['Ending B — The Truth Revealed','The forged loan unravelled in a 14th-floor hearing room. Your father\'s name is cleared, and Kade\'s sedan is now evidence in someone else\'s case.'],
   C:['Ending C — A New Beginning','The debt isn\'t entirely gone, but it no longer owns you. You\'ve grown sharper, stronger, and steadier — and the future finally feels like yours to choose.'],
   D:['Ending D — A Complicated Future','The story with Kade is over, but its echoes aren\'t. Money is tight and questions remain. Still — you\'re standing, and second chances can come more than once.']}[k];
  const relLine=c=>{const R=S.chars[c],n=PEOPLE[c].name;return ['You never really met '+n+'.',`${n} remembers you as a friendly face.`,`${n} became a good friend who still sends you terrible memes.`,`You and ${n} never quite said it out loud — but the door is open.`,`You and ${n} are dating, figuring things out one evening at a time.`,`${n} is your partner. Whatever comes next, you face it together.`][R.stage];};
  const jobs=Object.keys(S.jobs).filter(hired).map(j=>`${JOBS[j].n} (Lv ${Career.level(j)})`);
  const qd=Object.keys(S.quests).length;
  $('#ending').innerHTML=`<div class="endcard"><p class="evtag">THE END · DAY ${S.ending.day}</p><h1>${T[0]}${S.ending.bonus||''}</h1><div class="lineup">${svgChar('player','happy')}${ROMANCE.filter(c=>S.chars[c].stage>=2).map(c=>svgChar(c,'happy')).join('')}${svgChar('mom',k==='D'?'sad':'happy')}</div>
  <div class="box"><h3>📖 Epilogue</h3><p>${T[1]}</p><p>${F('kept_watch')?'Dad\'s watch still ticks on your wrist.':F('sold_watch')?'Someday you plan to buy Dad\'s watch back from Gopal.':''} ${F('letter_mom')?'Mom keeps Dad\'s letter in her prayer box.':''} ${S.biz?`Your ${BIZ[S.biz.type].n} keeps growing.`:''}</p></div>
  <div class="grid" style="margin-top:12px"><div class="box"><h3>💰 Finances</h3><div class="kv"><span>Cash</span><b>${fmt(S.cash)}</b></div><div class="kv"><span>Savings</span><b>${fmt(S.bank)}</b></div><div class="kv"><span>Remaining debt</span><b class="${S.debt?'neg-t':'pos-t'}">${fmt(S.debt)}</b></div><div class="kv"><span>Total repaid</span><b>${fmt(S.paidTotal)}</b></div><div class="kv"><span>Lifetime earnings</span><b>${fmt(S.earned)}</b></div></div>
  <div class="box"><h3>💼 Career & business</h3><p>${jobs.length?jobs.join(', '):'No steady job'}</p><p>${S.biz?`${BIZ[S.biz.type].n}, Level ${S.biz.level}, lifetime profit ${S.biz.total<0?'−':''}${fmt(S.biz.total)}`:'No business'}</p></div>
  <div class="box"><h3>🧠 Skills</h3><div class="kv"><span>Intelligence</span><b>${S.int}</b></div><div class="kv"><span>Charisma</span><b>${S.cha}</b></div><div class="kv"><span>Strength</span><b>${S.str}</b></div><div class="kv"><span>Popularity</span><b>${S.pop}</b></div><div class="kv"><span>Happiness</span><b>${S.happy}</b></div><div class="kv"><span>Reputation</span><b>${Player.repLabel()}</b></div></div>
  <div class="box"><h3>📜 Quests & evidence</h3><p>${qd}/${QUESTS.length} quests completed</p><p>${evCount()}/5 pieces of evidence held</p><p>${Object.keys(S.ach).length}/${ACH.length} achievements</p></div></div>
  <div class="box"><h3>💞 Relationships</h3>${ROMANCE.map(c=>`<p>• ${relLine(c)}</p>`).join('')}</div>
  <div class="box"><h3>⚖️ Key decisions</h3>${S.decisions.length?S.decisions.slice(-12).map(d=>`<p>• ${d}</p>`).join(''):'<p>None recorded.</p>'}</div>
  <div class="row" style="margin:16px 0 30px"><button class="mbtn primary" data-act="newGame">▶ New Game</button><button class="mbtn" data-act="mainmenu">Main Menu</button></div></div>`;

  ${fromMenu===true?'<div class="mrow"><button class="btn" data-act="closeModal">Close</button></div>':''}`);},
 closeModal(){UI.closeModal();if(S&&!$('#game').classList.contains('hidden'))UI.render();},
 confirmYes(){const f=UI._yes;UI._yes=null;UI.closeModal();if(f)f();},
 save(){Save.save();},
 restart(){UI.confirm('Restart from Day 1? Your current save will be replaced.',()=>ACT.newGame());},
 mainmenu(){if(S&&!S.ending)Save.save(true);UI.closeModal();UI.closeSheet();$('#contBtn').disabled=!Save.exists();UI.show('menu');},
 resetSave(){UI.confirm('Delete your saved progress permanently?',()=>{Save.reset();$('#contBtn').disabled=true;UI.toast('Save deleted','info');if(S&&!$('#game').classList.contains('hidden')){S=null;UI.show('menu');}});},
 sound(){Settings.sound=!Settings.sound;Settings.save();ACT.pause(!S||$('#game').classList.contains('hidden'));},
 text(k){Settings.text=k;Settings.save();Settings.apply();ACT.pause(!S||$('#game').classList.contains('hidden'));},
 info(){Settings.info=!Settings.info;Settings.save();ACT.pause(!S||$('#game').classList.contains('hidden'));},
 tab(t){if(S.ev&&t==='city'){UI.toast('Finish the current scene first','info');return;}if(UI.tab===t)UI.closeSheet();else UI.open(t);Sound.click();},
 closeSheet(){UI.closeSheet();UI.render();},
 choose(i){Dec.choose(+i);},
 cont(){Dec.cont();},
 act(id){if(S.ev)return UI.toast('Finish the current scene first','info');if(UI.tab&&!['shopbooks','shop','bizpanel'].includes(id))UI.closeSheet();Act.run(id);},
 goHome(){if(S.ev)return;const mode=has('bikekey')&&S.energy>=4?'bike':'walk';if(S.hour>=22){S.hour=Math.min(24,S.hour+1);S.loc='home';UI.flash='🏠 You made it home.';UI.closeSheet();Game.after();}else Loc.travel('home',mode);},
 travel(a){const [l,m]=a.split('|');Loc.travel(l,m);},
 work(j){if(S.ev)return UI.toast('Finish the current scene first','info');UI.closeSheet();Career.work(j);},
 apply(j){if(S.ev)return UI.toast('Finish the current scene first','info');Career.apply(j);},
 char(c){UI.open('char:'+c);},
 talk(c){if(S.ev||S.today.talk[c]||!Rel.here(c))return;const R=C(c),D=CHARD[c];Ev.start({gen:'talk',p:{c,f:(S.day+R.talks)%2,g:(S.day+R.talks)%D.good.length,o:(S.day+R.talks)%D.open.length}});UI.closeSheet();Game.after(true);},
 hang(c){if(S.ev||!Rel.here(c)||C(c).stage<2||S.today.hang[c]||S.cash<150)return;Ev.start({gen:'hang',p:{c,f:S.day%2}});UI.closeSheet();Game.after(true);},
 date(c){if(S.ev||!Rel.here(c)||C(c).stage<3||S.cash<400)return;const r=Rel.dateBlock(c);Ev.start(r?{gen:'decline',p:{c,r}}:{gen:'date',p:{c,f:S.day%2}});UI.closeSheet();Game.after(true);},
 gift(a){const [c,i]=a.split('|');if(S.ev||!Rel.here(c))return;Rel.gift(c,i);UI.closeSheet();Game.after(true);},
 buy(i){Eco.buy(i);},
 use(i){Inv.use(i);},
 phoneTab(k){UI.phoneTab=k;UI.renderSheet();},
 jobsTab(k){UI.jobsTab=k;UI.renderSheet();},
 questTab(k){UI.questTab=k;UI.renderSheet();},
 phoneBank(){UI.phoneTab='bank';UI.open('phone');},
 bank(op){const v=Math.floor(+(($('#amt')||{}).value||0));
  if(op==='depall')return Eco.deposit(S.cash);if(op==='wdall')return Eco.withdraw(S.bank);
  if(!(v>0))return UI.toast('Enter an amount first','info');if(op==='dep')Eco.deposit(v);else Eco.withdraw(v);},
 repay(a){const due=Math.max(0,Math.min(S.dueAmt,S.debt+S.paidWeek)-S.paidWeek);Eco.repay(a==='all'?S.cash:a==='due'?due:+a);},
 bizStart(t){Biz.start(t);},bizUp(){Biz.upgrade();},bizWork(){Biz.work();}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(!f)return;e.preventDefault();
 try{f(b.dataset.arg);}catch(err){console.error(err);UI.toast('Something went wrong — progress is safe','neg');}});
document.addEventListener('keydown',e=>{if(!S||$('#game').classList.contains('hidden')||!$('#modal').classList.contains('hidden'))return;
 if(e.target.tagName==='INPUT')return;
 if(S.ev&&!S.ev.res&&['1','2','a','b','A','B'].includes(e.key))Dec.choose(['1','a','A'].includes(e.key)?0:1);
 else if(S.ev&&S.ev.res&&(e.key==='Enter'||e.key===' ')){e.preventDefault();Dec.cont();}
 else if(e.key==='Escape'&&UI.tab)ACT.closeSheet();});

/* ---------------- Settings & boot ---------------- */
Settings.save=function(){try{localStorage.setItem(SET_KEY,JSON.stringify({sound:Settings.sound,text:Settings.text,info:Settings.info}));}catch(e){}};
Settings.apply=function(){document.documentElement.style.setProperty('--fs',{s:'14px',m:'16px',l:'18.5px'}[Settings.text]||'16px');};
try{const st=JSON.parse(localStorage.getItem(SET_KEY)||'{}');if(typeof st.sound==='boolean')Settings.sound=st.sound;if(['s','m','l'].includes(st.text))Settings.text=st.text;if(typeof st.info==='boolean')Settings.info=st.info;}catch(e){}
Settings.apply();
$('#lineup').innerHTML=['aanya','riya','player','meera','sana'].map(c=>svgChar(c,'happy')).join('');
$('#contBtn').disabled=!Save.exists();
</script>
</body>
</html>
